            <rect x="180" y="170" width="80" height="80" transform="rotate(45 220 210)" fill="#1c1917"/>
            <text x="220" y="215" font-family="Georgia, serif" font-size="14" letter-spacing="4" text-anchor="middle" fill="#d4af37">AURA</text>
        </g>
    </g><text x="400" y="955" text-anchor="middle" font-family="Georgia, serif" font-size="12" letter-spacing="5" fill="#8c7f73">AURA ATELIER</text></svg>